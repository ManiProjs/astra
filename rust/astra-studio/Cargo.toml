[package]
name = "astra-studio"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "astra-studio"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
